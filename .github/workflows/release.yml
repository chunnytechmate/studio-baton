name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full suite runs again against the tag. A release that ships code the
  # tests never saw is exactly the release that breaks someone's studio.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel carries its data files
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          from pathlib import Path
          import baton
          root = Path(baton.__file__).parent
          for name in ("defaults.yaml", "locale/th.yaml", "migrations/sqlite.sql",
                       "contracts/lesson_summary.schema.json"):
              assert (root / name).is_file(), f"{name} missing from the wheel"
          print("wheel contents ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing; no API token to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
