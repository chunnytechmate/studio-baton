# Packaged defaults. A profile's baton.yaml is deep-merged over this file, so a
# profile only needs to state what differs. Nothing here is secret: credentials
# are named by environment variable, never by value.

version: 1

# ---------------------------------------------------------------------------
# Presentation
# ---------------------------------------------------------------------------
locale: en          # message catalogue: en | th (see src/baton/locale/)
timezone: UTC       # IANA name; every date Baton prints or writes uses it

# Domain vocabulary. Baton's model is "one person, taught one-to-one, across
# numbered sessions" — these labels rename that model for your studio without
# touching code. They affect human-readable output only; JSON keys are stable.
labels:
  learner: student
  learners: students
  session: week
  sessions: weeks
  piece: song
  pieces: songs
  work: work
  works: works

# ---------------------------------------------------------------------------
# Learner records
# ---------------------------------------------------------------------------
db:
  driver: sqlite          # sqlite | supabase | postgrest

  sqlite:
    path: data/studio.db  # relative paths resolve inside the profile directory
    # SQLite allows one writer at a time. A statement waits this long for a
    # competing one before giving up, so two Baton commands overlapping is
    # ordinary rather than an error.
    busy_timeout_ms: 5000

  supabase:
    url_env: SUPABASE_PROJECT_URL
    key_env: SUPABASE_PROJECT_API

  postgrest:
    url_env: POSTGREST_URL
    jwt_env: POSTGREST_JWT
    schema: public

  # Optional secondary store used only when the primary is unreachable. Set to
  # a driver block of the same shape to enable. Read paths fall over to it;
  # writes never do, so the two stores cannot silently diverge.
  fallback: null

  tables:
    learners: learners
    sessions: sessions
    pieces: pieces
    works: works

  # Column names, so an existing schema can be adopted without migrating it.
  fields:
    learner:
      id: id
      name: name
      instrument: instrument
      tone: tone
      has_instrument: has_instrument
      current_piece_id: current_piece_id
    session:
      id: id
      learner_id: learner_id
      number: number
      doc_id: doc_id
    piece:
      id: id
      title: title
      source_link: source_link
      practice_track: practice_track
      sheet_link: sheet_link
    work:
      id: id
      learner_id: learner_id
      title: title
      type: type
      video_link: video_link
      performed_date: performed_date

# ---------------------------------------------------------------------------
# Session selection
# ---------------------------------------------------------------------------
learner:
  # A session left In progress past its date by more than this many days is
  # treated as abandoned: `learner next` moves on to the following session
  # instead of pointing at it forever. A fresh In-progress page is always the
  # target — the studio's flow books a lesson, the page turns In progress, and
  # the summary is written onto that page. `null` never abandons a page (the
  # legacy system's behaviour).
  next_stale_days: 1

  # `learner in-progress` reads the calendar for this many days back (today
  # included) and checks only those learners' pages — the morning "who still
  # owes a summary" question costs one calendar call plus one document read
  # per candidate, instead of reading every session page of every learner.
  in_progress_days: 14

# ---------------------------------------------------------------------------
# Session documents (the per-session page a learner and their family read)
# ---------------------------------------------------------------------------
docs:
  driver: notion

  notion:
    token_env: NOTION_API_TOKEN
    api_version: "2022-06-28"

  # Concurrent document reads when joining a learner's sessions. Kept low:
  # document APIs rate-limit, and a wider pool mostly produces more 429s for
  # the retry layer to absorb.
  max_parallel_reads: 4

  # Property names on the session page. Rename to match an existing database.
  properties:
    status: Status
    titles: Titles
    date: Date

  # Values of the status property. Session resolution keys off these.
  statuses:
    done: Done
    in_progress: In progress
    not_started: Not started

  # Selective-update policy. When a summary is rewritten, blocks matching any
  # rule below survive; everything else is replaced. This encodes what used to
  # be a prose instruction ("never clear the whole page") as data the script
  # enforces, so uploaded videos and sheet links cannot be destroyed by an edit.
  preserve:
    - type: video
    - type: embed
    - type: bookmark
    - type: file
    # Example of a content-sensitive rule; add your own markers here.
    # - {type: callout, icon: "🎧"}
    # - {type: heading_3, startswith: "🎵"}

  # Reading a summarised page as named sections, for lesson preparation. Each
  # key names a section; its list holds the words a heading may carry to open
  # it (case-insensitive substring, so emoji and bracketed English survive).
  # Order matters: a heading matching two sections belongs to the first one.
  # These defaults are the studio's own template headings.
  sections:
    overview: [ภาพรวมการเรียน, Overview]
    content: [เนื้อหา, สิ่งที่เรียน, Core Lesson]
    focus: [โฟกัส, Focus]
    practice_goals: [เป้าหมายการซ้อม, Practice Goals]
    next_goal: [ครั้งถัดไป]
    homework: [การบ้าน, Homework]

  # Block types that are homework wherever they sit on the page — a checklist
  # under "overview" is still a thing to practise.
  homework_types: [to_do]

  # The summariser's credit line, stripped from every section (DOTALL regex).
  summary_footer: 'หางยาว \(\d+ .*\) สรุปนี้มาจากผู้ช่วย AI'

# ---------------------------------------------------------------------------
# Lesson preparation
# ---------------------------------------------------------------------------
prep:
  # The report is a gate, not a summary: a learner listed only when every
  # required field of their latest session is present, so nothing half-read
  # reaches the teacher. Fields a studio tracks loosely belong in `warning`
  # instead — reported when missing, never blocking.
  required: [week, date, titles, notion_link, overview, content, homework]
  warning: [next_goal]

  # Per-section ceiling when reading a page, in characters.
  max_section_chars: 400

# ---------------------------------------------------------------------------
# Finished courses
# ---------------------------------------------------------------------------
courses:
  archive:
    # A finished course is kept as a copy of its page, named for the span it
    # covered. Baton computes the name and checks the copy; the copy itself is
    # made by the harness's duplicate tool, because a table rebuilt call by
    # call loses its layout and looks like an archive without being one.

    # Sub-pages beside the course page whose title contains one of these are
    # treated as the folder finished courses belong in. When a learner has no
    # such folder, the copy stays where the live course is — which is where a
    # duplicate already lands, so nothing has to move.
    folder_titles: [Archives, Archive]

    # {course} is the live page's title with any span it already carries
    # stripped, plus --label in brackets when one is given. {span} is below.
    title: "{course} ({span})"

    span:
      # Each end without its year. The year is appended to the closing end,
      # and to the opening end as well when the two fall in different years.
      format: "%d/%m"
      year: "%y"
      # gregorian | buddhist — applied to the year only, so a studio that
      # writes 2569 for 2026 gets the names its shelves already use.
      era: gregorian
      separator: " - "
      joiner: "/"

# ---------------------------------------------------------------------------
# Messaging
# ---------------------------------------------------------------------------
chat:
  driver: line            # line | telegram | webhook

  line:
    token_env: LINE_CHANNEL_ACCESS_TOKEN
    api_url: https://api.line.me/v2/bot/message/push

  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    api_url: https://api.telegram.org

  webhook:
    url_env: BATON_WEBHOOK_URL
    # Optional shared secret sent as X-Baton-Signature when set.
    secret_env: BATON_WEBHOOK_SECRET

  # Named recipients. `id_env` holds the platform user/chat id; `aliases` are
  # the words a person might actually type. Resolution is exact-or-alias only —
  # a partial match is reported as ambiguous rather than guessed.
  contacts: {}
  # contacts:
  #   owner:
  #     id_env: BATON_CONTACT_OWNER
  #     aliases: [me, teacher]
  #   manager:
  #     id_env: BATON_CONTACT_MANAGER
  #     aliases: [boss]

# ---------------------------------------------------------------------------
# Video
# ---------------------------------------------------------------------------
media:
  # Where recordings arrive.
  source:
    driver: gdrive        # gdrive | local
    local:
      path: clips         # one subdirectory per learner, named exactly as they are

  drive:
    folder_id_env: BATON_DRIVE_FOLDER_ID
    download_retries: 3

  publish:
    driver: youtube

  youtube:
    refresh_token_env: YOUTUBE_REFRESH_TOKEN
    client_id_env: GOOGLE_CLIENT_ID
    client_secret_env: GOOGLE_CLIENT_SECRET
    privacy: unlisted
    category_id: "22"
    max_parallel_uploads: 3
  encode:
    driver: ffmpeg
    binary: ffmpeg
    profile: auto           # auto | passthrough | 1080p
    # A wedged encode holds the whole run, so every invocation is killed after
    # this long rather than waiting for someone to notice in the morning.
    timeout_minutes: 30
    extra_args: []

# ---------------------------------------------------------------------------
# Calendar
# ---------------------------------------------------------------------------
calendar:
  driver: google
  google:
    calendar_id: primary
    refresh_token_env: GOOGLE_CALENDAR_REFRESH_TOKEN
    client_id_env: GOOGLE_CLIENT_ID
    client_secret_env: GOOGLE_CLIENT_SECRET

  # How long a lesson runs when no end time is given.
  default_minutes: 60

  # Words your studio types for relative days, mapped to a day offset.
  # `today`, `tomorrow`, `yesterday` and signed offsets like `+2` always work.
  # Date arithmetic is done in code rather than by a model, so an off-by-one
  # cannot book a lesson on the wrong day.
  date_shorthand: {}
  # date_shorthand:
  #   พน: 1        # tomorrow
  #   วน: 0        # today
  #   มร: 2        # the day after tomorrow

  # How far from today a cancel may reach. Rewriting a past week's records is
  # usually a mistake rather than an intention, so it is refused past this.
  rollback_window_days: 1
  # Emoji prefixed to a lesson event, chosen by the learner's instrument.
  # The key is matched case-insensitively against the instrument field.
  event_emoji: {}
  default_event_emoji: ""
  # A lesson event is only created after the session document update succeeds,
  # so the calendar can never disagree with the documents. Turning this off is
  # possible but reintroduces that drift.
  require_doc_update: true

# ---------------------------------------------------------------------------
# Quick notes
# ---------------------------------------------------------------------------
notes:
  # The page new notes are created under. Markdown is converted to blocks by
  # Baton — the conversion is mechanical, and a model that drops a line while
  # doing it produces a note that simply looks shorter than you remembered.
  parent_id_env: BATON_NOTES_PARENT

# ---------------------------------------------------------------------------
# Fail-closed gates
# ---------------------------------------------------------------------------
gates:
  # Fields that must be present before a lesson message is sent. Any missing
  # field blocks the send with exit code 5. There is no override flag.
  send_lesson_required:
    - doc_link
    - short_summary
    - session_number
  # Fields worth warning about but not worth blocking on.
  send_lesson_optional:
    - practice_track
    - video_link

# ---------------------------------------------------------------------------
# Content authored by a model
# ---------------------------------------------------------------------------
llm:
  # Baton does not call a model. Summaries are written by whichever agent is
  # driving the CLI and submitted as JSON validated against a schema. Leaving
  # this as "none" is what lets a local model of any size drive Baton safely.
  provider: none

summary:
  # Section headings in the rendered document. Rename or translate them here;
  # the renderer never invents a heading of its own.
  sections:
    overview: Overview
    covered: What we covered
    focus: Focus areas
    goals: Practice goals

  # Emoji on theory callouts. Matching this to a docs.preserve rule is what
  # keeps them across a later rewrite.
  callout_icon: ""

  # Constraints enforced on the parent-facing message. These are validated in
  # code, not merely requested in a prompt — a prose instruction not to use
  # emoji is exactly what a small model ignores.
  short_summary:
    max_lines: 5
    allow_emoji: false
    allow_links: false
    bullet: "•"
    labels:
      covered: Covered
      progress: Progress
      homework: Practice
